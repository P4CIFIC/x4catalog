name: x4catalog
region: nyc
features:
  - buildpack-stack=ubuntu-22
static_sites:
  - name: www
    github:
      repo: P4CIFIC/x4catalog
      branch: main
      deploy_on_push: true
    source_dir: frontend
    environment_slug: node-js
    build_command: npm ci && VITE_HOSTED=1 VITE_BASE=/ VITE_OUTDIR=dist npm run build && cp -f ../static/styles.css ../static/favicon.svg ../static/catalog-url.json dist/
    output_dir: dist
    index_document: index.html
    catchall_document: index.html
    envs:
      - key: VITE_HOSTED
        value: "1"
        scope: BUILD_TIME
      - key: VITE_BASE
        value: /
        scope: BUILD_TIME
ingress:
  rules:
    - match:
        path:
          prefix: /
      component:
        name: www
domains:
  - domain: x4catalog.com
    type: PRIMARY
  - domain: www.x4catalog.com
    type: ALIAS
