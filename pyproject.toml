[project]
name = "x4catalog"
version = "0.1.0"
description = "Local-first, open-source catalog for XTEINK X4 sleep-screen BMPs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.14"
authors = [
  { name = "X4 Catalog contributors" },
]
keywords = ["xteink", "x4", "eink", "catalog", "local-first"]
classifiers = [
  "License :: OSI Approved :: The Unlicense (Unlicense)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Environment :: Console",
  "Environment :: Web Environment",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pillow>=11.0",
  "numpy>=2.1",
]

[project.optional-dependencies]
ml = [
  "torch>=2.5",
  "transformers==5.10.1",
  "timm>=1.0.0",
  "scipy>=1.14",
  "fairscale>=0.4.4",
  "protobuf>=5.27",
  "huggingface-hub>=0.27",
  "ram @ git+https://github.com/xinyu1205/recognize-anything.git",
]
dev = [
  "httpx>=0.28",
  "pytest>=8.3",
]

[project.urls]
Homepage = "https://www.x4catalog.com"
Repository = "https://github.com/P4CIFIC/x4catalog"
Issues = "https://github.com/P4CIFIC/x4catalog/issues"
Source = "https://github.com/P4CIFIC/x4catalog"

[project.scripts]
x4catalog = "x4catalog.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
